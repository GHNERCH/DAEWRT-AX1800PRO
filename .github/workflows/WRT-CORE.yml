#云编译公用核心
name: WRT-CORE

on:
  workflow_call:
    inputs:
      WRT_CONFIG:
        required: true
        type: string
      WRT_THEME:
        required: true
        type: string
      WRT_NAME:
        required: true
        type: string
      WRT_SSID:
        required: true
        type: string
      WRT_WORD:
        required: true
        type: string
      WRT_IP:
        required: true
        type: string
      WRT_PW:
        required: true
        type: string
      WRT_REPO:
        required: true
        type: string
      WRT_BRANCH:
        required: true
        type: string
      WRT_SOURCE:
        required: false
        type: string
      WRT_PACKAGE:
        required: false
        type: string
      WRT_TEST:
        required: false
        type: string
      CI_NAME:
        required: false
        type: string
      WRT_ARCH:
        required: false
        type: string

env:
  GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
  WRT_CONFIG: ${{inputs.WRT_CONFIG}}
  WRT_THEME: ${{inputs.WRT_THEME}}
  WRT_NAME: ${{inputs.WRT_NAME}}
  WRT_SSID: ${{inputs.WRT_SSID}}
  WRT_WORD: ${{inputs.WRT_WORD}}
  WRT_IP: ${{inputs.WRT_IP}}
  WRT_PW: ${{inputs.WRT_PW}}
  WRT_REPO: ${{inputs.WRT_REPO}}
  WRT_BRANCH: ${{inputs.WRT_BRANCH}}
  WRT_PACKAGE: ${{inputs.WRT_PACKAGE}}
  WRT_TEST: ${{inputs.WRT_TEST}}
  WRT_DIR: 'wrt'
  CI_NAME: ${{inputs.CI_NAME}}
  WRT_ARCH: ${{inputs.WRT_ARCH}}

jobs:
  core:
    name: ${{inputs.WRT_SOURCE}}
    runs-on: ubuntu-24.04

    steps:
      - name: Install BC
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt -yqq install bc

      - name: Free Disk Space
        uses: endersonmenezes/free-disk-space@v2
        with:
          remove_android: true
          remove_dotnet: true
          remove_haskell: true
          remove_tool_cache: true
          remove_swap: true
          remove_packages: "azure-cli google-cloud-cli microsoft-edge-stable google-chrome-stable firefox postgresql* temurin-* *llvm* mysql* dotnet-sdk-*"
          remove_packages_one_command: true
          remove_folders: "/usr/share/swift /usr/share/miniconda /usr/share/az* /usr/share/glade* /usr/local/share/chromium /usr/local/share/powershell"
          testing: false

      - name: Checkout Projects
        uses: actions/checkout@main

      - name: Initialization Environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt -yqq purge firefox
          sudo -E apt -yqq update
          sudo -E apt -yqq full-upgrade
          sudo -E apt -yqq autoremove --purge
          sudo -E apt -yqq autoclean
          sudo -E apt -yqq clean
          sudo -E apt -yqq install dos2unix libfuse-dev
          sudo bash $GITHUB_WORKSPACE/Scripts/init_build_environment.sh
          sudo -E systemctl daemon-reload
          sudo -E timedatectl set-timezone "Asia/Shanghai"

      - name: Initialization Values
        run: |
          echo "WRT_DATE=$(TZ=Asia/Shanghai date '+%y.%m.%d-%H.%M.%S')" >> $GITHUB_ENV
          echo "WRT_MARK=$(echo $GITHUB_REPOSITORY | cut -d '/' -f 1)" >> $GITHUB_ENV
          echo "WRT_VER=$(echo $WRT_REPO | cut -d '/' -f 4)-$WRT_BRANCH" >> $GITHUB_ENV
          echo "WRT_TARGET=$(grep -m 1 -oP '^CONFIG_TARGET_\K[\w]+(?=\=y)' ./Config/$WRT_CONFIG.txt | tr '[:lower:]' '[:upper:]')" >> $GITHUB_ENV
          echo "WRT_KVER=none" >> $GITHUB_ENV
          echo "WRT_LIST=none" >> $GITHUB_ENV
          echo "WRT_CI=$WRT_CI" >> $GITHUB_ENV

          if [ -z "$WRT_ARCH" ]; then
            WRT_ARCH_FROM_CONFIG="$(grep -m 1 -oP '^CONFIG_TARGET_.+_DEVICE_\K.+(?=\=y)' "$GITHUB_WORKSPACE/Config/$WRT_CONFIG.txt" || true)"

            if [ -z "$WRT_ARCH_FROM_CONFIG" ]; then
              WRT_ARCH_FROM_CONFIG="$WRT_CONFIG"
            fi

            echo "WRT_ARCH=$WRT_ARCH_FROM_CONFIG" >> $GITHUB_ENV
          else
            echo "WRT_ARCH=$WRT_ARCH" >> $GITHUB_ENV
          fi

          echo "$WRT_REPO/$WRT_BRANCH" > "$GITHUB_WORKSPACE/repo_flag"

      - name: Clone Code
        run: |
          git clone --depth=1 --single-branch --branch $WRT_BRANCH $WRT_REPO ./wrt/

          cd ./wrt/
          echo "WRT_HASH=$(git log -1 --pretty=format:'%h')" >> $GITHUB_ENV

      - name: Update Dae/Daed rules
        run: |
          cd ./wrt
          mkdir -p files/usr/share/dae
          wget -O files/usr/share/dae/geoip.dat https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geoip.dat
          wget -O files/usr/share/dae/geosite.dat https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geosite.dat
          cd files/usr/share
          ln -sf dae daed
          ls -l

      - name: Check Scripts
        run: |
          find ./ -maxdepth 3 -type f -iregex ".*\(txt\|sh\)$" -exec dos2unix {} \; -exec chmod +x {} \;

      - name: Cache Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ./wrt/.ccache
            ./wrt/staging_dir
          key: ${{ env.WRT_ARCH }}-${{ hashFiles('**/repo_flag') }}-${{ env.WRT_DATE }}
          restore-keys: |
            ${{ env.WRT_ARCH }}-${{ hashFiles('**/repo_flag') }}-

      - name: Refresh the cache
        run: |
          if [ -d "./wrt/staging_dir" ]; then
            find "./wrt/staging_dir" -type d -name "stamp" -not -path "*target*" | while read -r dir; do
              find "$dir" -type f -exec touch {} +
            done
          fi

      - name: Update Feeds
        run: |
          cd ./wrt/

          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Custom Packages
        run: |
          cd ./wrt/package/

          $GITHUB_WORKSPACE/Scripts/Packages.sh
          $GITHUB_WORKSPACE/Scripts/Handles.sh

      - name: Custom Settings
        run: |
          . $GITHUB_WORKSPACE/Scripts/function.sh
          cd ./wrt/

          generate_config && cat .config

          $GITHUB_WORKSPACE/Scripts/Settings.sh

          echo "==== Force keep DAED panel and core ===="

          sed -i '/CONFIG_PACKAGE_luci-app-daed/d' .config || true
          sed -i '/CONFIG_PACKAGE_daed/d' .config || true
          sed -i '/CONFIG_PACKAGE_dae/d' .config || true
          sed -i '/CONFIG_PACKAGE_luci-app-dae/d' .config || true

          printf "%s\n" "CONFIG_PACKAGE_luci-app-daed=y" >> .config
          printf "%s\n" "CONFIG_PACKAGE_daed=y" >> .config
          printf "%s\n" "CONFIG_PACKAGE_dae=y" >> .config
          printf "%s\n" "CONFIG_PACKAGE_luci-app-dae=n" >> .config

          echo "==== Force custom firmware version by rootfs overlay ===="

          mkdir -p files/etc
          mkdir -p files/etc/uci-defaults
          mkdir -p files/etc/init.d
          mkdir -p files/etc/rc.d
          mkdir -p files/usr/bin

          {
            printf "%s\n" "DISTRIB_ID='阿宇定制固件'"
            printf "%s\n" "DISTRIB_RELEASE='兆能M2专用版'"
            printf "%s\n" "DISTRIB_REVISION='ZNM2'"
            printf "%s\n" "DISTRIB_TARGET='qualcommax/ipq60xx'"
            printf "%s\n" "DISTRIB_ARCH='aarch64_cortex-a53'"
            printf "%s\n" "DISTRIB_DESCRIPTION='阿宇定制固件 兆能M2专用版'"
            printf "%s\n" "DISTRIB_TAINTS=''"
          } > files/etc/openwrt_release

          printf "%s\n" "阿宇定制固件 兆能M2专用版" > files/etc/openwrt_version

          {
            printf "%s\n" "#!/bin/sh"
            printf "%s\n" ""
            printf "%s\n" "cat > /etc/openwrt_release.tmp <<'EOR'"
            printf "%s\n" "DISTRIB_ID='阿宇定制固件'"
            printf "%s\n" "DISTRIB_RELEASE='兆能M2专用版'"
            printf "%s\n" "DISTRIB_REVISION='ZNM2'"
            printf "%s\n" "DISTRIB_TARGET='qualcommax/ipq60xx'"
            printf "%s\n" "DISTRIB_ARCH='aarch64_cortex-a53'"
            printf "%s\n" "DISTRIB_DESCRIPTION='阿宇定制固件 兆能M2专用版'"
            printf "%s\n" "DISTRIB_TAINTS=''"
            printf "%s\n" "EOR"
            printf "%s\n" "mv /etc/openwrt_release.tmp /etc/openwrt_release"
            printf "%s\n" "printf '%s\n' '阿宇定制固件 兆能M2专用版' > /etc/openwrt_version"
            printf "%s\n" ""
            printf "%s\n" "if [ -f /usr/lib/lua/luci/version.lua ]; then"
            printf "%s\n" "  sed -i \"s|^distname *=.*|distname = '阿宇定制固件'|g\" /usr/lib/lua/luci/version.lua"
            printf "%s\n" "  sed -i \"s|^distversion *=.*|distversion = '兆能M2专用版'|g\" /usr/lib/lua/luci/version.lua"
            printf "%s\n" "  sed -i \"s|^luciname *=.*|luciname = '阿宇定制面板'|g\" /usr/lib/lua/luci/version.lua"
            printf "%s\n" "  sed -i \"s|^luciversion *=.*|luciversion = '兆能M2专用版'|g\" /usr/lib/lua/luci/version.lua"
            printf "%s\n" "fi"
            printf "%s\n" ""
            printf "%s\n" "if [ -f /usr/lib/lua/luci/version.lua ]; then"
            printf "%s\n" "  sed -i -e \"s| / DaeWRT-[0-9A-Za-z._:-]*||g\" -e \"s|DaeWRT-[0-9A-Za-z._:-]*||g\" /usr/lib/lua/luci/version.lua"
            printf "%s\n" "fi"
            printf "%s\n" ""
            printf "%s\n" "exit 0"
          } > files/usr/bin/custom-version-apply

          chmod +x files/usr/bin/custom-version-apply

          {
            printf "%s\n" "#!/bin/sh"
            printf "%s\n" ""
            printf "%s\n" "/usr/bin/custom-version-apply"
            printf "%s\n" ""
            printf "%s\n" "exit 0"
          } > files/etc/uci-defaults/99-custom-version

          chmod +x files/etc/uci-defaults/99-custom-version

          {
            printf "%s\n" "#!/bin/sh /etc/rc.common"
            printf "%s\n" ""
            printf "%s\n" "START=99"
            printf "%s\n" ""
            printf "%s\n" "boot() {"
            printf "%s\n" "  /usr/bin/custom-version-apply"
            printf "%s\n" "}"
            printf "%s\n" ""
            printf "%s\n" "start() {"
            printf "%s\n" "  /usr/bin/custom-version-apply"
            printf "%s\n" "}"
          } > files/etc/init.d/custom-version

          chmod +x files/etc/init.d/custom-version
          ln -sf ../init.d/custom-version files/etc/rc.d/S99custom-version

          echo "==== Remove DaeWRT build mark from source files if exists ===="

          for dir in files package package/base-files feeds; do
            if [ -d "$dir" ]; then
              grep -R "DaeWRT" -n "$dir" 2>/dev/null || true
              find "$dir" -type f -print0 2>/dev/null | xargs -0 -r sed -i -e "s| / DaeWRT-[0-9A-Za-z._:-]*||g" -e "s|DaeWRT-[0-9A-Za-z._:-]*||g"
            fi
          done

          echo "==== DAED config before defconfig ===="
          grep -E "CONFIG_PACKAGE_(luci-app-daed|daed|dae|luci-app-dae)=" .config || true

          make defconfig -j$(nproc)

          echo "==== Force keep DAED again after defconfig ===="

          sed -i '/CONFIG_PACKAGE_luci-app-daed/d' .config || true
          sed -i '/CONFIG_PACKAGE_daed/d' .config || true
          sed -i '/CONFIG_PACKAGE_dae/d' .config || true
          sed -i '/CONFIG_PACKAGE_luci-app-dae/d' .config || true

          printf "%s\n" "CONFIG_PACKAGE_luci-app-daed=y" >> .config
          printf "%s\n" "CONFIG_PACKAGE_daed=y" >> .config
          printf "%s\n" "CONFIG_PACKAGE_dae=y" >> .config
          printf "%s\n" "CONFIG_PACKAGE_luci-app-dae=n" >> .config

          make defconfig -j$(nproc)

          echo "==== DAED config after final defconfig ===="
          grep -E "CONFIG_PACKAGE_(luci-app-daed|daed|dae|luci-app-dae)=" .config || true

          make clean -j$(nproc)

      - name: Download Packages
        if: env.WRT_TEST != 'true'
        run: |
          cd ./wrt/

          make download -j$(nproc)

      - name: Update Dae core
        if: env.WRT_TEST != 'true'
        run: |
          cd ./wrt/

          echo "==== Update dae core ===="

          mkdir -p files/usr/bin

          DAE_TAG="v1.1.0"
          DAE_URL="https://github.com/daeuniverse/dae/releases/download/${DAE_TAG}/dae-linux-arm64.zip"

          wget -O dae.zip "$DAE_URL"
          unzip -o -j dae.zip dae-linux-arm64
          mv -f dae-linux-arm64 files/usr/bin/dae
          chmod +x files/usr/bin/dae
          rm -f dae.zip

          echo "==== dae version ===="
          files/usr/bin/dae --version || true

      - name: Compile Firmware
        if: env.WRT_TEST != 'true'
        run: |
          cd ./wrt/

          make -j$(nproc) || make -j1 V=s

      - name: Check DAED in build result
        if: env.WRT_TEST != 'true'
        run: |
          cd ./wrt/

          echo "==== Check DAED in .config ===="
          grep -E "CONFIG_PACKAGE_(luci-app-daed|daed|dae|luci-app-dae)=" .config || true

          echo "==== Check DAED in manifest ===="
          find ./bin/targets/ -type f -name "*.manifest" -exec grep -E "^(luci-app-daed|daed|dae) " {} \; || true

          echo "==== Check DAED files in rootfs ===="
          find ./build_dir/target-*/root-* -type f \( -path "*luci*daed*" -o -path "*/usr/bin/dae" -o -path "*/usr/bin/daed" \) 2>/dev/null || true

      - name: Delete Old Cache
        run: |
          echo "==== Delete old cache ===="

          CACHE_PREFIX="${WRT_ARCH}-${{ hashFiles('**/repo_flag') }}-"

          if [ -z "$WRT_ARCH" ]; then
            CACHE_PREFIX="${WRT_CONFIG}-${{ hashFiles('**/repo_flag') }}-"
          fi

          echo "Cache prefix: $CACHE_PREFIX"

          gh cache list --key "$CACHE_PREFIX" --json key --jq '.[] | .key' | while read -r key; do
            if [ -n "$key" ]; then
              echo "Deleting cache: $key"
              gh cache delete -- "$key" || true
            fi
          done

          echo "========cache status========"
          echo "ccache: $(du -sh ./wrt/.ccache 2>/dev/null | cut -f 1 || echo 0)"
          echo "staging: $(du -sh ./wrt/staging_dir 2>/dev/null | cut -f 1 || echo 0)"

      - name: Machine Information
        run: |
          cd ./wrt/

          echo "======================="
          lscpu | grep -E "name|Core|Thread"
          echo "======================="
          df -h
          echo "======================="
          du -h --max-depth=1
          echo "======================="

      - name: Package Firmware
        run: |
          cd ./wrt/
          mkdir -p ./upload/

          cp -f ./.config ./upload/Config-"$WRT_CONFIG"-"$WRT_VER"-"$WRT_DATE".txt

          if [[ $WRT_TEST != 'true' ]]; then
            echo "WRT_KVER=$(find ./bin/targets/ -type f -name "*.manifest" -exec grep -oP '^kernel - \K[\d\.]+' {} \;)" >> $GITHUB_ENV
            echo "WRT_LIST=$(find ./bin/targets/ -type f -name "*.manifest" -exec grep -oP '^luci-(app|theme)[^ ]*' {} \; | tr '\n' ' ')" >> $GITHUB_ENV

            find ./bin/targets/ -iregex ".*\(buildinfo\|json\|sha256sums\|packages\)$" -exec rm -rf {} +

            for FILE in $(find ./bin/targets/ -type f -iname "*$WRT_TARGET*") ; do
              EXT=$(basename $FILE | cut -d '.' -f 2-)
              NAME=$(basename $FILE | cut -d '.' -f 1 | grep -io "\($WRT_TARGET\).*")
              NEW_FILE="$WRT_VER"-"$NAME"-"$WRT_DATE"."$EXT"
              mv -f $FILE ./upload/$NEW_FILE
            done

            find ./bin/targets/ -type f -exec mv -f {} ./upload/ \;

            make clean -j$(nproc)
          fi

      - name: Release Firmware
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{env.CI_NAME}}-${{env.WRT_CONFIG}}_${{env.WRT_DATE}}
          files: ./wrt/upload/*.*
          body: |
            兆能 M2 专属定制固件包
            默认主题：Aurora
            默认地址：${{env.WRT_IP}}

            源码：${{env.WRT_REPO}}
            分支：${{env.WRT_BRANCH}}
            提交：${{env.WRT_HASH}}

            配置：${{env.WRT_CONFIG}}
            平台：${{env.WRT_TARGET}}

            登录地址：${{env.WRT_IP}}
            登录密码：${{env.WRT_PW}}

            WIFI名称：${{env.WRT_SSID}}
            WIFI密码：${{env.WRT_WORD}}

            内核版本：${{env.WRT_KVER}}
            插件列表：${{env.WRT_LIST}}
